version: 1.7.0+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  image_picker: ^1.0.7
  http: ^1.2.0
  fl_chart: ^0.68.0
  excel: ^4.0.3
  share_plus: ^9.0.0
  intl: ^0.19.0
